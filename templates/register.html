<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | SmartCampus</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
        .reg-card { width: 100%; max-width: 500px; background: #ffffff; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12); border: 1px solid #e2e8f0; padding: 35px; }
        .btn-gradient { background: var(--gradient); color: #ffffff !important; border: none; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; }
        .form-control { border-radius: 12px; padding: 10px 14px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div class="reg-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle text-white mb-2" style="background: var(--gradient);">
                <i class="fa-solid fa-id-card fs-4"></i>
            </div>
            <h3 class="fw-bold text-dark">Create Account</h3>
            <p class="text-muted small">Register to file and monitor campus grievances</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} rounded-3 small py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Full Name *</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Aryan Thakur" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Roll Number *</label>
                    <input type="text" name="roll_no" class="form-control" placeholder="e.g. 21CS105" required>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">Mobile Number *</label>
                    <input type="tel" name="mobile" pattern="[0-9]{10}" class="form-control" placeholder="10-digit mobile" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="name@college.edu" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Create Password *</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-gradient mb-3">
                Generate OTP & Verify <i class="fa-solid fa-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="text-center">
            <p class="small text-muted mb-0">Already registered? <a href="/login" class="fw-semibold text-primary">Log in</a></p>
        </div>
    </div>
</body>
</html>

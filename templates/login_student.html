<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छात्र लॉगिन | CPGRAMS SmartCampus</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; }
        .auth-card { max-width: 460px; margin: 60px auto; background: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                    <i class="fa-solid fa-right-to-bracket fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark">छात्र लॉगिन (Student Login)</h3>
                <p class="text-muted small">अपने पंजीकृत मोबाइल नंबर से प्रवेश करें</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} rounded-3 small py-2">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/login-student" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">पंजीकृत मोबाइल नंबर *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-mobile-screen"></i></span>
                        <input type="tel" name="mobile" class="form-control" placeholder="10 अंक मोबाइल" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">पासवर्ड *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                    <i class="fa-solid fa-shield-halved me-1"></i> सुरक्षित लॉगिन करें
                </button>
            </form>

            <div class="text-center">
                <p class="small text-muted mb-0">नया खाता बनाना है? <a href="/register" class="fw-semibold text-primary">यहाँ रजिस्टर करें</a></p>
                <a href="/" class="small text-muted text-decoration-none mt-2 d-inline-block"><i class="fa-solid fa-arrow-left me-1"></i> होमपेज</a>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - SmartCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top, #1e1e24 0%, #0f1013 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .admin-card {
            background: #181a1f;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 15px rgba(220, 53, 69, 0.15);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #2d3139;
        }
        .card-header-admin {
            background: linear-gradient(135deg, #1f232a, #14161a);
            padding: 35px 25px 25px;
            text-align: center;
            border-bottom: 2px solid #dc3545;
        }
        .admin-shield {
            width: 65px;
            height: 65px;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #ff4d5e;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.2);
        }
        .form-control {
            background-color: #21242b;
            border: 1px solid #323742;
            color: #f8f9fa;
            border-radius: 10px;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
        }
        .form-control:focus {
            background-color: #262932;
            border-color: #dc3545;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.2);
        }
        .form-control::placeholder {
            color: #6c757d;
        }
        .input-icon-group {
            position: relative;
        }
        .input-icon-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
        }
        .btn-admin-submit {
            background: linear-gradient(135deg, #b91c1c, #ef4444);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-admin-submit:hover {
            background: linear-gradient(135deg, #991b1b, #dc2626);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
            color: white;
        }
    </style>
</head>
<body>
<div class="admin-card">
    <div class="card-header-admin">
        <div class="admin-shield">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h4 class="fw-bold text-white mb-1">SmartCampus Admin Portal</h4>
        <p class="mb-0 small text-danger text-uppercase tracking-wider fw-semibold" style="letter-spacing: 1px;">Authorized Access Only</p>
    </div>
    <div class="p-4 p-md-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 py-2 small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close small py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/admin-login">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Admin Username</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Admin Password</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-admin-submit">Sign In as Admin</button>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <a href="/" class="small text-secondary text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Campus Portal</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrative Login - SmartCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #111827 0%, #1f2937 50%, #030712 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px 0;
        }
        .admin-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border-top: 4px solid #dc2626;
        }
        .card-header-custom {
            background: #182230;
            color: #ffffff;
            padding: 30px 25px 25px;
            text-align: center;
        }
        .icon-circle {
            width: 65px;
            height: 65px;
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
            color: #ef4444;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid #dbe2ea;
        }
        .form-control:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.15);
        }
        .btn-admin {
            background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-admin:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            color: white;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="card-header-custom">
        <div class="icon-circle">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h4 class="fw-bold mb-1 text-danger">Administrative Access</h4>
        <small class="text-light opacity-75">Grievance Cell Officers & Incharge Only</small>
    </div>
    
    <div class="p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/admin-login">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">ADMIN USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">ADMIN PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-admin">Authorize Admin Portal</button>
            </div>
        </form>

        <div class="text-center pt-2 border-top">
            <small><a href="/" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Public Tracker</a></small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

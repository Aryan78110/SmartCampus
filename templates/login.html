<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication | SmartCampus</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            padding: 35px;
        }
        .form-control {
            background-color: #0f172a;
            border: 1.5px solid #334155;
            color: #f8fafc;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #6366f1;
            color: #f8fafc;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }
        .btn-auth {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: white;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-4 bg-primary-subtle text-primary mb-3">
                <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h4 class="fw-bold mb-1">Administrative Access</h4>
            <p class="text-muted small">Enter credentials to manage grievances</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3 border-0 bg-danger-subtle text-danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small text-secondary fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small text-secondary fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-auth w-100 mb-3">Authenticate</button>
            <div class="text-center">
                <a href="/" class="text-decoration-none small text-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Return to Student Portal
                </a>
            </div>
        </form>
    </div>
</body>
</html>

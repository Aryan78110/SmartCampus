<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login - SmartCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        .card-header-custom {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            padding: 35px 25px 25px;
            text-align: center;
            color: white;
        }
        .icon-badge {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 14px 12px 42px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .input-icon-group {
            position: relative;
        }
        .input-icon-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .btn-submit {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>
<div class="portal-card">
    <div class="card-header-custom">
        <div class="icon-badge">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h4 class="fw-bold mb-1">Student Portal</h4>
        <p class="mb-0 small text-light opacity-75">Track status, lodge grievances & view updates</p>
    </div>
    <div class="p-4 p-md-5 bg-white">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 py-2 small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close small py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Mobile Number</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <input type="text" name="mobile" class="form-control" placeholder="10-digit mobile number" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Password</label>
                <div class="input-icon-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-submit text-white">Sign In as Student</button>
            </div>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="small text-muted mb-1">New student? <a href="/register" class="fw-bold text-primary text-decoration-none">Create an Account</a></p>
            <a href="/" class="small text-secondary text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Public Tracker</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
